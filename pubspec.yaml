name: locora
description: 'A clean, modern location pin icon with a subtle city skyline inside it, representing guided city exploration and discovery.'
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.3.0
  cloudinary_public: ^0.21.0
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  google_sign_in: ^7.2.0
  flex_color_scheme: ^8.4.0
  flutter_staggered_grid_view: ^0.7.0
  hugeicons: ^1.1.6
  image_picker: ^1.1.0
  shared_preferences: ^2.5.5
  geolocator: ^10.0.0
  random_avatar: ^0.0.8
  forui_assets: ^0.21.0
  forui: ^0.21.3
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  flutter_native_splash: ^2.4.7
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: '^0.14.4'

flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  image_path: 'assets/icon/locora.png'
  min_sdk_android: 21

flutter_native_splash:
  color: '#F8FAFC'
  image: assets/splash/light.png
  fullscreen: true
  android_gravity: fill
  ios_content_mode: center

  color_dark: '#020617'
  image_dark: assets/splash/light_1.png

  android_12:
    color: '#F8FAFC'
    color_dark: '#020617'
    fullscreen: true
    android_gravity: fill
    ios_content_mode: center

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/onboarding/
    - assets/images/
